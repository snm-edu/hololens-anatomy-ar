<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>解剖 AR — 女性全臓器（皮膚・筋肉なし）</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:sans-serif}
    #log{position:fixed;top:8px;left:8px;right:8px;max-height:38vh;overflow:auto;color:#7CFC00;
         background:rgba(0,0,0,.55);font:13px/1.4 monospace;white-space:pre-wrap;padding:8px;border-radius:6px;z-index:10}
    #btn{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);z-index:30;font:bold 34px sans-serif;
         padding:24px 52px;background:#1060ff;color:#fff;border:none;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.6);
         text-align:center;line-height:1.3}
    #cred{position:fixed;bottom:2px;right:6px;color:#888;font:10px monospace;z-index:5}
  </style>
</head>
<body>
  <div id="log">解剖 AR ローダー（女性・全臓器）</div>
  <button id="btn" disabled>読み込み中…</button>
  <div id="cred">Model: HuBMAP/HRA VH_Female — CC BY 4.0</div>
  <div id="toapp" hidden>
    <p>このiPad/iPhoneでは、アプリ「AnatomyAR」で開いてください。<br>
      （このページのAR表示は HoloLens 2 用で、iOS の Safari では動きません）</p>
    <button id="toappbtn">アプリで開く</button>
    <p id="toappcode"></p>
  </div>
  <script>
  // 入室QRを iOS 標準のカメラアプリで読むと、このページが Safari で開く。
  // iPhone/iPad の Safari は WebXR に対応しておらず下の読み込みは無駄になるので、
  // アプリ（anatomyar://）へ引き渡す。HoloLens 2 はこの分岐に入らず従来どおり動く。
  //
  // ⚠️ Universal Links（確認タップ無しでアプリが開く）は使えない。Apple の設定ファイルは
  //   ドメイン直下に application/json で置く必要があるが、GitHub Pages は拡張子なしのファイルを
  //   application/octet-stream で返し、ヘッダを変える手段が無い（2026-09-12 に実測）。
  //   独自ドメインを用意できたら Universal Links へ移行する。
  (function () {
    var params = new URLSearchParams(location.search);
    var room = params.get('room');
    // 解除/教員コードの自動登録用（2026-09-15追加）。長い文字列の手入力・コピペを
    // 200人規模にさせると誤入力の温床になるため、QRを見せるだけで登録まで終わらせる。
    var code = params.get('code');
    var ua = navigator.userAgent;
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS はMacを名乗る
    if (!isIOS) return;

    var target, fallbackText;
    if (code) {
      target = 'anatomyar://register?code=' + encodeURIComponent(code);
      fallbackText = 'アプリが開かないときは、アプリの「コード管理」に届いた文字列を貼り付けてください';
    } else if (room && /^[A-Za-z0-9_-]{4,32}$/.test(room)) {
      target = 'anatomyar://join?room=' + encodeURIComponent(room);
      // 他校が自校のCloudflareアカウントへ独立に展開したときの中継ヒント。
      // ここで拾わずに捨てると、アプリへ引き渡した瞬間に既定（札幌看護）の中継へ
      // 誤って固定される（2026-09-13・他校展開の配線修正）。
      var relay = params.get('relay');
      if (relay && /^[a-z0-9-]{1,63}$/.test(relay)) {
        target += '&relay=' + encodeURIComponent(relay);
      }
      fallbackText = 'アプリが開かないときは、アプリの「コードで入る」に ' + room + ' を入力してください';
    } else {
      return;
    }

    var box = document.getElementById('toapp');
    box.hidden = false;
    box.style.cssText = 'position:fixed;inset:0;z-index:100;background:#000;color:#fff;' +
      'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;' +
      'font:16px/1.6 sans-serif;text-align:center;padding:24px';
    var btn = document.getElementById('toappbtn');
    btn.style.cssText = 'font:bold 22px sans-serif;padding:18px 36px;background:#1060ff;color:#fff;' +
      'border:none;border-radius:14px';
    document.getElementById('toappcode').textContent = fallbackText;
    btn.onclick = function () { location.href = target; };
    // 一度だけ自動で試す。アプリが入っていれば iOS が「開きますか？」と聞く。
    setTimeout(function () { location.href = target; }, 300);
  })();
  </script>
  <script src="atlas/dict.js"></script>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
  <script type="module">
    const logEl=document.getElementById('log'), btn=document.getElementById('btn');
    const log=(m)=>{logEl.textContent+="\n"+m;console.log(m);try{fetch('beacon?m='+encodeURIComponent('anat:'+m),{cache:'no-store'});}catch(e){}};
    log("boot "+navigator.userAgent.slice(0,50));
    log("版: 向き補正・札の距離 v9（診断つき）");
    addEventListener('error', e=>log('JSERR: '+(e.message||e)));
    addEventListener('unhandledrejection', e=>log('REJECT: '+(e.reason&&e.reason.message?e.reason.message:e.reason)));

    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { readRoomParams } from './sync/config.js';
    import { createRoom } from './sync/room.js?v=7';   // 拒否コードの扱いを変えた版（Pages の10分キャッシュ対策）
    import { makeViewSync } from './sync/viewsync.js';
    import { labelName, humanize } from './names.js?v=8';   // ページと同時に更新されるよう版を付ける（Pages は10分キャッシュ）
    log("three r"+THREE.REVISION+" import OK");
    if('xr' in navigator) navigator.xr.isSessionSupported('immersive-ar').then(s=>log("immersive-ar supported: "+s));

    const renderer=new THREE.WebGLRenderer({antialias:false, alpha:true});
    renderer.setClearColor(0x000000,0);
    renderer.setSize(innerWidth,innerHeight);
    renderer.xr.enabled=true; renderer.xr.setReferenceSpaceType('local');
    document.body.appendChild(renderer.domElement);
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.01,50);
    scene.add(new THREE.HemisphereLight(0xffffff,0x223344,2.5));
    const dir=new THREE.DirectionalLight(0xffffff,2.0); dir.position.set(1,2,1); scene.add(dir);

    const root=new THREE.Group(); scene.add(root);   // 回転・配置用の親
    let modelObj=null, radiusWorldBase=1, radiusLocal=1;   // 共有ルームの視点計算に使う
    let follower=false;                                    // 参加者モード（先生の操作に追従）
    const meshList=[];                                     // 表示状態の同期に使う全メッシュ

    // === 操作: 片手=平行移動のみ(回転しない) / 両手=回転＋拡大縮小＋移動 ===
    //   重要: 片手はアタッチ(reparent)しない＝手首の傾きを拾わない。これで持ち替えても
    //   モデルの向きが保たれ、両手回転を継続できる(=つまみ直しで明後日に回る不具合の根治)。
    //   回転ゲイン: 手の回転角×ROT_GAIN(手60°→モデル180°)。背面に届きやすく。
    const ROT_GAIN=3;
    const ctrls=[renderer.xr.getController(0), renderer.xr.getController(1)];
    ctrls.forEach(c=>{ c.userData.sel=false; scene.add(c); });
    let one=null, two=null;   // 片手/両手の基準値(rootは常にsceneの子・reparentしない)
    const yawOf=(a,b)=>Math.atan2(b.position.x-a.position.x, b.position.z-a.position.z);
    const midOf=(a,b)=>a.position.clone().add(b.position).multiplyScalar(0.5);

    function enterOne(c){   // 基準を都度取り直す＝持ち替えでもジャンプしない
      two=null;
      one={ c, handStart:c.position.clone(), posStart:root.position.clone() };
      log('片手: 移動');
    }
    function enterTwo(a,b){
      one=null;
      two={ dist0:Math.max(1e-4,a.position.distanceTo(b.position)), scale0:root.scale.x,
            prevYaw:yawOf(a,b), accum:0, rootYaw0:root.rotation.y,
            mid0:midOf(a,b), pos0:root.position.clone() };
      log('両手: 回転＋拡大縮小');
    }
    function refresh(){
      const sel=ctrls.filter(c=>c.userData.sel);
      // 参加者(follower)は回転・拡縮を先生に任せる。自分の手元では「置き場所」だけ動かせる。
      if(sel.length>=2 && !follower){ if(!two) enterTwo(sel[0],sel[1]); }
      else if(sel.length>=1){ enterOne(sel[0]); }
      else { one=null; two=null; log('離した'); }
    }
    // === つまんだ瞬間に名前: 手の光線の先の構造名を表示し、そのまま動かせば従来どおり移動 ===
    //   当初は「短いタップ＝名前／長押し＝移動」で分けたが、HL2実機では部位を選ぶ動きが
    //   1383ms・手の移動13.5cm（2026-10-03 実測）で、時間と距離では区別できなかった。
    //   両手目のつまみ（回転・拡縮の開始）では選び直さない。
    const DIAG=true;   // 実機診断: 光線の先に構造が無いときもAR内に札を出す。動作が確認できたら false に
    const onStart=(e)=>{ const c=e.target;
      if(!ctrls.some(o=>o!==c && o.userData.sel)){
        const ic=iconAt(c);
        if(ic){ const k=ic.object.userData.key; if(k==='align') cycleColoc(); else setModel(k); return; }   // アイコンは移動の起点にしない
        if(colocMode!=='align') pickAt(c);
      }
      c.userData.sel=true; refresh(); };
    const onEnd  =(e)=>{ e.target.userData.sel=false; refresh(); };
    ctrls.forEach(c=>{ c.addEventListener('selectstart',onStart); c.addEventListener('selectend',onEnd); });

    function updateManip(){
      if(colocMode==='fixed'){ one=null; two=null; return; }   // マーカーに固定中はうっかり動かさない
      if(two){
        const sel=ctrls.filter(c=>c.userData.sel);
        if(sel.length<2) return;
        const a=sel[0], b=sel[1];
        const dist=Math.max(1e-4, a.position.distanceTo(b.position));
        // 拡大縮小(両手の距離)
        if(colocMode==='off') root.scale.setScalar(Math.min(8, Math.max(0.05, two.scale0 * dist/two.dist0)));   // 合わせ中は等身大のまま
        // 回転(両手の角度・±π折返しをアンラップ＋ゲイン増幅)
        const yaw=yawOf(a,b);
        let d=yaw-two.prevYaw; if(d>Math.PI)d-=2*Math.PI; else if(d<-Math.PI)d+=2*Math.PI;
        two.accum+=d*ROT_GAIN; two.prevYaw=yaw;
        root.rotation.y=two.rootYaw0+two.accum;
        // 移動(両手の中点)
        root.position.copy(two.pos0).add(midOf(a,b).sub(two.mid0));
      } else if(one){
        if(!one.c.userData.sel){ one=null; return; }
        // 平行移動のみ(向き・大きさは不変)
        root.position.copy(one.posStart).add(one.c.position.clone().sub(one.handStart));
      }
    }

    const draco=new DRACOLoader();
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
    const loader=new GLTFLoader(); loader.setDRACOLoader(draco);

    // ===== 標本（女性／男性）。AR内のアイコンをつまんで切り替える =====
    const MODELS={
      female:{ label:'女性', sym:'♀', glb:'vendor/anatomy.glb?v=3',   // 相対パス（GitHub Pagesサブパス対応）。再変換時にvを上げる
        credit:'Model: HuBMAP/HRA VH_Female — CC BY 4.0',
        // 非表示: 乳房(乳腺/乳頭/乳輪＋胸の脂肪fat_L/R)・臍帯複合・胎盤(白)・子宮一式(赤)。
        //   皮膚(青い殻)は表示維持。fat_L/R は Z+0.35〜0.53(胸高)＝乳房脂肪なので乳房として除去。
        // 注: 'uterus|uterine' 限定で outer_cortex_of_kidney(=腎皮質)への誤爆を回避。
        //     Allen_mammillary_*=脳の乳頭体・*_spinal_cord_*=脊髄 も対象外。
        hide:/mammary_lobes|_nipple_|_areola|_fat_[LR]$|umbilical_cord|umbilical_artery|umbilical_vein|placenta|amnion|chorionic_plate|basal_plate|uterus|uterine|uterosacral|uterovesical/i },
      male:{ label:'男性', sym:'♂', glb:'vendor/male.glb?v=1',
        credit:'Model: BodyParts3D © DBCLS — CC BY 4.0 ／ 再構成: human-atlas (MIT)',
        // iPadアプリの男性標本（human-atlas 軽量版）を HoloLens 向けに変換したもの。
        //   筋（横隔膜以外）と外性器・陰毛は変換時に除去済み（HL2には表示切替の画面が無いため）。
        //   ポリゴンは iPad 版の約半分。⚠️ この標本には肺が無く、肝臓は尾状葉のみ。
        //   材質は系統ごとに共有（15個）。光らせるときは setHighlight がその部位だけ材質を差し替える。
        // 皮膚は女性と同じく半透明。胸郭は閉じているので半透明にして中を見せる（iPad版と同じ値）
        translucent:[[/^skin$/i,0.22],[/_rib$|_rib_|costal_cartilage|sternum|manubrium|xiphoid|diaphragm/i,0.55]] },
    };
    // iPadアプリの標本ID → HL2の標本（AnatomyAR/ModelCatalog.swift の id）
    const MODEL_OF_TEACHER={ female:'female', human_atlas_lite:'male', human_atlas:'male' };
    const loaded={};   // 読み込み済みの標本（切り替えのたびにダウンロードし直さない）
    let curKey=null, loadingKey=null, placed=false;
    function prepare(def, model){
      let tris=0, meshes=0, hidden=0; const hiddenNames=[];
      model.traverse(o=>{
        if(!o.isMesh) return;
        meshes++;
        // AR で前面を塞ぐ構造はこの端末の方針として常に隠す（共有ルームでも上書きさせない）
        if(def.hide && def.hide.test(o.name)){ o.userData.forceHidden=true; o.visible=false; hidden++; if(hiddenNames.length<14) hiddenNames.push(o.name); return; }
        const g=o.geometry; tris += g.index? g.index.count/3 : (g.attributes.position? g.attributes.position.count/3:0);
        const op = def.translucent ? (def.translucent.find(([re])=>re.test(o.name))||[])[1] : undefined;
        // 半透明にする部位だけ材質を複製（共有のまま変えると同じ系統の全部位が透ける＝肋骨と一緒に全骨格が透ける）
        if(op!==undefined) o.material = Array.isArray(o.material) ? o.material.map(m=>m.clone()) : o.material.clone();
        // 加算表示で見えるよう自発光ブースト＋両面
        const mats=Array.isArray(o.material)?o.material:[o.material];
        for(const mt of mats){ if(mt){ mt.emissive=mt.color? mt.color.clone():new THREE.Color(0x888888); mt.emissiveIntensity=0.35; mt.side=THREE.DoubleSide; mt.metalness=0.0; mt.roughness=0.9;
          if(op!==undefined){ mt.transparent=true; mt.opacity=op; mt.depthWrite=false; } } }
      });
      if(hidden) log(`非表示 ${hidden}件: ${hiddenNames.join(', ')}`);
      model.updateMatrixWorld(true);
      rebuildBatches(model);
      // 自動フィット: 高さ0.7mへスケール→原点中心化
      const box=new THREE.Box3().setFromObject(model);
      const size=new THREE.Vector3(), center=new THREE.Vector3();
      box.getSize(size); box.getCenter(center);
      const h=Math.max(size.x,size.y,size.z)||1;
      // 等身大（②マーカー合わせ）用: iPadアプリの変換と同じく「身長1.60m・足元の中央が原点」
      //   （anatomy-ar-ios/tools/glb_to_usd_native.py）。女性GLBは中心が原点なのでこれをしないと
      //   足がマーカーより0.8m下に埋まる（2026-10-03 実測）。
      const ls=1.60/h, life={s:ls, pos:new THREE.Vector3(-center.x, -box.min.y, -center.z).multiplyScalar(ls)};
      const s=0.7/h; model.scale.setScalar(s);
      model.position.sub(center.multiplyScalar(s));
      model.userData.fit={h,s,pos:model.position.clone(),life};
      log(`✓ GLB読込完了(${def.label}) meshes=${meshes} tris=${Math.round(tris)} 元高さ=${h.toFixed(2)} scale=${s.toFixed(3)}`);
    }
    // === 描画をまとめる: 同じ見た目（色・不透明）の部位を1つのメッシュに結合して描く ===
    //   ブラウザは部位1つごとに描画命令を出す。男性（1,821部位）は三角形数が女性とほぼ同じ
    //   （34万 vs 32万）なのに重かった（2026-10-03 実機）＝部位数が効いていると判断。
    //   部位そのものは PART_LAYER に移して描かず、光線の当たり判定と名前引きだけに使う。
    //   光らせる部位だけ通常レイヤーに戻し、結合メッシュの手前に重ねて描く（setHighlight）。
    //   半透明の部位（皮膚・胸郭など）は描画順が崩れるので結合しない。
    const PART_LAYER=5;   // 1・2 は three が左右の目に使うので避ける
    function rebuildBatches(model){
      for(const b of model.userData.batches||[]){ model.remove(b); b.geometry.dispose(); }
      const inv=new THREE.Matrix4().copy(model.matrixWorld).invert();
      const groups=new Map();
      model.traverse(o=>{
        if(!o.isMesh || o.userData.batch) return;
        o.layers.set(0); o.userData.batched=false;
        const m=o.userData.hiMat ? o.userData.origMat : o.material;
        if(Array.isArray(m) || !o.visible || m.transparent || !o.geometry.index) return;
        let vis=true; for(let p=o.parent; p && p!==model; p=p.parent) if(!p.visible) vis=false;
        if(!vis) return;
        const key=m.color.getHexString()+'|'+m.side;
        if(!groups.has(key)) groups.set(key,{mat:m, parts:[]});
        groups.get(key).parts.push(o);
      });
      const batches=[];
      for(const {mat,parts} of groups.values()){
        if(parts.length<2) continue;
        const geos=parts.map(o=>{
          const g=new THREE.BufferGeometry();
          g.setAttribute('position', o.geometry.attributes.position.clone());
          if(o.geometry.attributes.normal) g.setAttribute('normal', o.geometry.attributes.normal.clone());
          g.setIndex(o.geometry.index.clone());
          return g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
        });
        const ok=geos.every(g=>!!g.attributes.normal)===geos.some(g=>!!g.attributes.normal);
        const merged= ok ? mergeGeometries(geos,false) : null;
        geos.forEach(g=>g.dispose());
        if(!merged) continue;   // 結合できない組はそのまま個別に描く
        const bm=new THREE.Mesh(merged, mat); bm.userData.batch=true; bm.raycast=()=>{};   // 当たり判定は部位側で行う
        model.add(bm); batches.push(bm);
        for(const o of parts){ o.layers.set(PART_LAYER); o.userData.batched=true; if(o.userData.hiMat) o.layers.enable(0); }
      }
      model.userData.batches=batches;
      let draws=0; model.traverse(o=>{ if(o.isMesh && o.visible && o.layers.isEnabled(0)) draws++; });
      log(`描画まとめ: ${batches.length}組へ結合・描画対象 ${draws}`);
    }
    function show(key){
      const model=loaded[key], def=MODELS[key];
      clearPick();
      if(selMesh){ setHighlight(selMesh,false); selMesh=null; }
      if(modelObj) root.remove(modelObj);
      meshList.length=0; model.traverse(o=>{ if(o.isMesh && !o.userData.batch) meshList.push(o); });
      root.add(model);
      placeModel(model);
      modelObj=model; radiusLocal=model.userData.fit.h*0.5; radiusWorldBase=model.userData.fit.h*0.5*model.userData.fit.s;   // 共有ルーム用
      // local座標は原点=頭の位置。目線やや下・正面0.8mに配置（切り替えでは置き場所を保つ）
      if(!placed){ root.position.set(0, -0.1, -0.8); placed=true; }
      curKey=key; document.getElementById('cred').textContent=def.credit;
      drawIcons();
      if(pendingState){ try{ applyState(pendingState); }catch(e){} }
    }
    function setModel(key){
      if(!Object.hasOwn(MODELS, key) || key===curKey || loadingKey) return;
      if(loaded[key]){ show(key); log('標本: '+MODELS[key].label); return; }
      const def=MODELS[key]; loadingKey=key; drawIcons();
      log("GLB 読み込み開始 "+def.glb);
      let pct=-1;
      loader.load(def.glb,
        (gltf)=>{ prepare(def, gltf.scene); loaded[key]=gltf.scene; loadingKey=null; show(key);
          if(btn.disabled && !renderer.xr.isPresenting){

    const RAY_LEN=2.0, CAST_MS=100;

    function updatePointers(){

    // 名前の札を出す（自分でつまんだときも、先生が選んだときも同じ見せ方）。point=引出線の始点（世界座標）
    function placeLabel(mesh, point){
      if(labelSprite){ labelSprite.parent?.remove(labelSprite); labelSprite.material.map.dispose(); labelSprite.material.dispose(); labelSprite=null; }
      if(labelLine){ labelLine.parent?.remove(labelLine); labelLine.geometry.dispose(); labelLine.material.dispose(); labelLine=null; }
      const jp=labelName(mesh.name), en=humanize(mesh.name);

      //   次を指しにくい（2026-10-03 実機）。左右は見ている人から見て当たり点のある側。
      const viewer = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      const right=new THREE.Vector3(1,0,0).applyQuaternion(viewer.getWorldQuaternion(new THREE.Quaternion()));
      right.y=0; if(right.lengthSq()<1e-6) right.set(1,0,0); right.normalize();
      // 体全体の外側に出すと、等身大では広げた腕・手まで含むので札が遠すぎた（2026-10-03 実機）。
      //   指した高さ（身長の±3%）にかかる部位だけで体の幅を測り、そのすぐ外に出す
      const box=new THREE.Box3().setFromObject(modelObj), ctr=box.getCenter(new THREE.Vector3());

      const at=ctr.clone().addScaledVector(right, side*(half+0.02+lw/2)); at.y=point.y;
      const edge=at.clone().addScaledVector(right, -side*lw/2);   // 札の体側の端
      // 模型と一緒に動くよう root の子にする。札の大きさは root の拡縮を打ち消して一定に保つ
      labelSprite.position.copy(root.worldToLocal(at.clone()));
      labelSprite.scale.divideScalar(root.scale.x);
      root.add(labelSprite);
      labelLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([root.worldToLocal(point.clone()), root.worldToLocal(edge)]),
        new THREE.LineBasicMaterial({color:0xffe200, depthTest:false, transparent:true}));

    }
    function syncTick(){

        showPointer(wantPose.p||null);
      } else {   // 操作権を持っている、または誰も持っていない（=自由操作）。後者は最初の送信で操作権を得る。
        const now=performance.now();
        if(now-lastSent<83) return;   // 12Hz
        lastSent=now;
        const p=VS.encode({model:modelObj, centerWorld:root.getWorldPosition(new THREE.Vector3()),
                           radiusWorld:radiusWorldBase*root.scale.x, camWorld:camWorld()});
        // 静止中は送らない。ただし2秒に1度は必ず送る（待機中に入室した端末にも視点を届ける）
        const j=JSON.stringify(p);
        if(j!==lastJson || now-lastPoseSent>2000){ lastJson=j; lastPoseSent=now; room.sendPose(p); }
      }
    }
    // 部屋の状態をAR内に出す（没入中はページの文字が見えないため）。模型の左足元、アイコンの下
    const roomCv=document.createElement('canvas'); roomCv.width=512; roomCv.height=96;
    const roomSp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(roomCv), depthTest:false, transparent:true}));
    roomSp.renderOrder=997; roomSp.scale.set(0.16,0.03,1); roomSp.visible=false; root.add(roomSp);
    layoutUI();
    function showRoom(text, color){
      const g=roomCv.getContext('2d'); g.clearRect(0,0,512,96);
      g.fillStyle='rgba(0,0,0,0.65)'; g.fillRect(0,0,512,96);
      g.fillStyle=color; g.font='bold 40px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,256,50,496);
      roomSp.material.map.needsUpdate=true; roomSp.visible=true;
    }
    const ROOM_TEXT={ connecting:['接続中…','#ffe200'], reconnecting:['再接続中…','#ffe200'], open:['接続しました','#7CFC00'],
      waiting:['先生が部屋を開くのを待っています','#ffe200'], rejected:['この部屋には入れません','#ff6060'], closed:['切断（再接続します）','#ff9a40'] };
    if(RP.enabled && RP.room){
      room=createRoom({ url:RP.url, room:RP.room,
        onStatus:(s,detail)=>{ log('共有ルーム['+RP.room+']: '+s+(detail?' '+detail:''));
          const [t,c]=ROOM_TEXT[s]||[s,'#fff']; showRoom(`部屋 ${RP.room}：${t}`, c); },
        // 誰も操作権を持っていない間は自分で自由に回せる（1台だけで入室したときに固まらない）
        onRole:(isP,pid)=>{ follower=!!pid && !isP;
          if(follower) showRoom(`部屋 ${RP.room}：先生と連動中`,'#7CFC00');
          else if(!pid) showRoom(`部屋 ${RP.room}：先生（発表者）がいません`,'#ffe200');
          log(follower?'参加者モード（先生の操作に同期／片手で置き場所だけ移動可）'
                      :'自由操作モード（両手で回転・拡縮できます。動かすとあなたが操作権を持ちます）'); },
        onPose:(d)=>{ wantPose=d; },
        onState:(d)=>{ try{ applyState(d); }catch(e){ log('state適用エラー: '+(e.message||e)); } } });
      if(RP.role==='presenter') room.claim();
    }
    window.__dbg={THREE,VS,camera,root,syncTick,applyState,meshList,camWorld,
      get model(){return modelObj},get room(){return room},
      get wantPose(){return wantPose},get follower(){return follower},get selMesh(){return selMesh},
      pickAt,ctrls,pointers,updatePointers,icons,setModel,cycleColoc,markerFrame,get colocMode(){return colocMode},get curKey(){return curKey},
      get stateCount(){return stateCount}, get pickMesh(){return pickMesh},get labelSprite(){return labelSprite},get labelLine(){return labelLine}};

    let frames=0;
    renderer.setAnimationLoop(()=>{
      try{
        updateManip();                   // 両手=回転＋拡大縮小＋移動
        updatePointers();                // 手の光線と当たり点
        tickFps();
        syncTick();                      // 共有ルーム（未参加なら何もしない）
        renderer.render(scene,camera);   // 自動回転は廃止（手で掴んで回す）
        if(renderer.xr.isPresenting){
          if(frames===0) log("✓ AR初フレーム描画");
          if(frames>0 && frames%300===0) log("AR描画中 frame="+frames);
          frames++;
        }
      }catch(err){ log("RENDER ERR: "+(err.message||err)); }
    });

    btn.addEventListener('click', async ()=>{
      btn.disabled=true; btn.innerHTML='AR起動中…<br><span style="font-size:20px;font-weight:normal">（許可が出たら承認）</span>';
      log("requestSession 呼び出し…（初回は「許可/Allow」ダイアログが出ます。air-tapで承認）");
      try{
        const req=navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local']});
        const to=new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT: 許可ダイアログ未承認の可能性（視界内のAllow/はいをair-tap）')),20000));
        const s=await Promise.race([req,to]);
        log("✓ requestSession成功");
        await renderer.xr.setSession(s);
        log("✓ setSession完了（AR内にモデル）");
        s.addEventListener('end',()=>{log("session終了 frames="+frames);btn.disabled=false;btn.textContent='▶ ENTER AR';btn.style.display='';});
        btn.style.display='none';
      }catch(e){ log("✗ AR起動エラー: "+(e.name||'')+": "+(e.message||e)); btn.disabled=false; btn.textContent='▶ 再試行'; }
    });
  </script>
</body>
</html>
